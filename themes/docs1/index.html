<section class="hero">
  <div class="shell hero__inner">
    <p class="eyebrow">Documentation</p>
    <h1>{{site.title}}</h1>
    {{#if site.description}}<p class="lede">{{site.description}}</p>{{/if}}
  </div>
</section>

<section class="shell docs-grid" aria-label="Documentation sections">
  {{#for item in menus.primary.items}}
    {{#if_eq item.url "/"}}
    {{#else}}
    <a class="docs-card" href="{{item.url}}">
      <span class="docs-card__kicker">Section</span>
      <strong>{{item.title}}</strong>
      {{#if item.meta.description}}<span class="docs-card__desc">{{item.meta.description}}</span>{{/if}}
    </a>
    {{/if}}
  {{/for}}
</section>
