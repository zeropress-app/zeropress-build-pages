name: Build ZeroPress Pages
description: Build ZeroPress static output for GitHub Pages, Cloudflare Pages, Netlify, Vercel, and other static hosts.
author: ZeroPress
branding:
  icon: book-open
  color: blue
inputs:
  source:
    description: Dedicated source directory containing Markdown files and optional .zeropress/config.json. Repository root source is not supported.
    required: false
    default: ./docs
  public-dir:
    description: Public passthrough directory for site-owned assets. Defaults to source.
    required: false
  destination:
    description: Output directory for the generated static site.
    required: false
    default: ./_site
  theme:
    description: Bundled theme name. Currently supports "docs".
    required: false
    default: docs
  theme-path:
    description: Custom ZeroPress theme directory. Takes precedence over theme.
    required: false
  config:
    description: Config file path. Defaults to <source>/.zeropress/config.json.
    required: false
  site-url:
    description: Canonical site URL override.
    required: false
  skip-untitled-markdown:
    description: Skip Markdown files without a page title instead of failing.
    required: false
    default: "false"
  skip-link-check:
    description: Skip internal link checking after the site is built.
    required: false
    default: "false"
  copy-markdown-source:
    description: Copy original Markdown files to output and expose View this page as Markdown links.
    required: false
    default: "true"
runs:
  using: node24
  main: dist/action.js
